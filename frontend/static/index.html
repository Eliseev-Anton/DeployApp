<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mondays - Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-brand">Mondays</div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    Dashboard
                </a>
                <a href="#" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                    Projects
                </a>
                <a href="#" class="nav-item active">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
                    My Task
                </a>
                <a href="#" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                    Chats
                </a>
                <a href="#" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
                    Documents
                </a>
                <a href="#" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
                    Receipts
                </a>
            </nav>
            <div class="sidebar-section">
                <div class="section-label">
                    <span>Projects</span>
                    <button class="btn-icon-sm">+</button>
                </div>
                <div class="project-link"><span class="dot dot-purple"></span> Event Planning</div>
                <div class="project-link"><span class="dot dot-green"></span> Breakfast Plan</div>
            </div>
            <div class="sidebar-bottom">
                <a href="#" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                    Settings
                </a>
                <a href="#" class="nav-item">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    Help & Support
                    <span class="badge">8</span>
                </a>
            </div>
        </aside>

        <!-- Main -->
        <main class="main">
            <!-- Top bar -->
            <header class="topbar">
                <div class="search-wrap">
                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                    <input type="text" class="search" placeholder="Search or type a command">
                    <kbd class="kbd">&#8984; F</kbd>
                </div>
                <div class="topbar-right">
                    <button class="btn-primary" onclick="openModal()">+ New Project</button>
                    <button class="btn-ghost">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
                    </button>
                    <div class="avatar">J</div>
                </div>
            </header>

            <div class="content">
                <!-- Welcome -->
                <section class="welcome">
                    <div class="welcome-left">
                        <p class="welcome-date" id="current-date"></p>
                        <h1 class="welcome-heading">Good Evening! <span id="user-name" class="editable-name" contenteditable="true" spellcheck="false">John</span>,</h1>
                    </div>
                    <div class="welcome-right">
                        <button class="btn-outline">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                            Share
                        </button>
                        <button class="btn-outline" onclick="openModal()">+ Add Task</button>
                    </div>
                </section>

                <!-- Modal -->
                <div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
                    <div class="modal" onclick="event.stopPropagation()">
                        <div class="modal-header">
                            <h3>New Task</h3>
                            <button class="modal-close" onclick="closeModal()">&#10005;</button>
                        </div>
                        <div class="modal-body">
                            <label class="form-label">Task Name</label>
                            <input type="text" id="modal-title" class="form-input" placeholder="e.g. Create landing page design">

                            <label class="form-label">Priority</label>
                            <div class="priority-group">
                                <button class="priority-btn low" onclick="selectPriority('low', this)">
                                    <span class="priority-dot low"></span> Low
                                </button>
                                <button class="priority-btn medium selected" onclick="selectPriority('medium', this)">
                                    <span class="priority-dot medium"></span> Medium
                                </button>
                                <button class="priority-btn high" onclick="selectPriority('high', this)">
                                    <span class="priority-dot high"></span> High
                                </button>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                            <button class="btn-create" onclick="addTaskFromModal()">Create Task</button>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <section class="stats-row">
                    <div class="stat-chip">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                        <strong id="stat-total">0</strong> <span>Tasks Total</span>
                    </div>
                    <div class="stat-chip">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                        <strong id="stat-done">0</strong> <span>Completed</span>
                    </div>
                    <div class="stat-chip">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
                        <strong id="stat-left">0</strong> <span>In Progress</span>
                    </div>
                </section>

                <!-- Tasks Table -->
                <section class="panel">
                    <div class="panel-header">
                        <div class="panel-title">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                            My Projects
                            <select class="select-sm" id="time-filter" onchange="render()">
                                <option value="today">Today</option>
                                <option value="week" selected>This Week</option>
                                <option value="month">This Month</option>
                                <option value="all">All Time</option>
                            </select>
                        </div>
                        <div class="panel-actions">
                            <div class="filter-group">
                                <button class="chip active" onclick="setFilter('all', this)">All</button>
                                <button class="chip" onclick="setFilter('active', this)">Active</button>
                                <button class="chip" onclick="setFilter('done', this)">Done</button>
                            </div>
                            <a href="#" class="link-muted">See All</a>
                        </div>
                    </div>

                    <!-- Table Header -->
                    <div class="table-head">
                        <div class="th th-name">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                            Task Name
                        </div>
                        <div class="th th-priority">Priority</div>
                        <div class="th th-status">Status</div>
                        <div class="th th-date">Date</div>
                        <div class="th th-action"></div>
                    </div>

                    <!-- Add row -->
                    <div class="add-row">
                        <input type="text" id="task-input" class="add-input" placeholder="Type a new task...">
                        <select id="priority-select" class="add-select">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                        <button onclick="addTask()" class="btn-sm">+ Add</button>
                    </div>

                    <!-- Task rows -->
                    <div id="task-list" class="table-body"></div>
                </section>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
